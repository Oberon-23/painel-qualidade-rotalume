<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotalume Qualidade</title>
<meta name="description" content="Painel de qualidade de uma indústria fictícia: OEE, CEP, defeitos e ações corretivas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Onest:wght@400;500;600;700;800&display=swap">
<style>
html, body { margin: 0; height: 100%; }
[hidden] { display: none !important; }
/* Layout: menu lateral escuro com as guias; área principal com manchete em linguagem simples, 4 indicadores com meta e status, gráficos grandes com 12 meses de contexto e detalhes recolhidos. */
:root {
  --bg: #f5f0e3;
  --surface: #fffdf6;
  --surface-2: #efe5cf;
  --ink: #1c1710;
  --ink-2: #6b6251;
  --muted: #948a73;
  --line: #e3d7ba;
  --line-2: #ece1c6;
  --side-bg: #ece2c9;
  --side-ink: #1c1710;
  --side-muted: #7a705b;
  --side-hover: #e1d4b4;
  --side-line: #dccfae;
  --accent: var(--a-light);
  --accent-ink: #ffffff;
  --accent-soft: var(--a-soft-light);
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #6250d6;
  --ok: #0b7d3e; --ok-bg: #dcf0e1; --ok-mark: #1a9e55;
  --warn: #8a5a00; --warn-bg: #f8e3a8; --warn-mark: #e0a00e;
  --bad: #b3261e; --bad-bg: #f7dcd6; --bad-mark: #d93a30;
  --seq-1: #e3edfb; --seq-2: #bcd4f5; --seq-3: #8db6ee; --seq-4: #5a93e2; --seq-5: #2f6fc9; --seq-6: #1b4f99;
  --font: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 14px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1117; --surface: #141b23; --surface-2: #19222b; --ink: #e7ecf1; --ink-2: #a9b3bf; --muted: #7c8794; --line: #253039; --line-2: #1d272f;
    --side-bg: #0a0f14; --side-ink: #e7ecf1; --side-muted: #7f8b97; --side-hover: #151e27; --side-line: #1d2832;
    --accent: var(--a-dark); --accent-ink: #0b1016; --accent-soft: var(--a-soft-dark);
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #9085e9;
    --ok: #57c98a; --ok-bg: #14301f; --ok-mark: #3fbf77; --warn: #f0b440; --warn-bg: #352a10; --warn-mark: #e8ad2e; --bad: #f18b84; --bad-bg: #3b1a18; --bad-mark: #e8645b;
    --seq-1: #16263a; --seq-2: #183a63; --seq-3: #1c528f; --seq-4: #2a6dbf; --seq-5: #4f8fe0; --seq-6: #8dbaf0;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1117; --surface: #141b23; --surface-2: #19222b; --ink: #e7ecf1; --ink-2: #a9b3bf; --muted: #7c8794; --line: #253039; --line-2: #1d272f;
  --side-bg: #0a0f14; --side-ink: #e7ecf1; --side-muted: #7f8b97; --side-hover: #151e27; --side-line: #1d2832;
  --accent: var(--a-dark); --accent-ink: #0b1016; --accent-soft: var(--a-soft-dark);
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #9085e9;
  --ok: #57c98a; --ok-bg: #14301f; --ok-mark: #3fbf77; --warn: #f0b440; --warn-bg: #352a10; --warn-mark: #e8ad2e; --bad: #f18b84; --bad-bg: #3b1a18; --bad-mark: #e8645b;
  --seq-1: #16263a; --seq-2: #183a63; --seq-3: #1c528f; --seq-4: #2a6dbf; --seq-5: #4f8fe0; --seq-6: #8dbaf0;
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }
a { color: var(--accent); }

/* ---------- Estrutura ---------- */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side-bg); color: var(--side-ink); border-right: 1px solid var(--side-line); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 22px; padding: calc(22px + env(safe-area-inset-top, 0px)) 16px 18px max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.brand { display: flex; gap: 11px; align-items: center; padding: 0 6px; }
.logo { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; flex-shrink: 0; }
.logo svg { width: 20px; height: 20px; }
.brand b { display: block; font-size: 15px; font-weight: 700; line-height: 1.2; }
.brand small { display: block; font-size: 11.5px; color: var(--side-muted); }
.nav { display: flex; flex-direction: column; gap: 3px; }
.nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--side-muted); padding: 0 10px 6px; font-weight: 600; }
.nav button { appearance: none; border: 0; background: none; color: var(--side-ink); text-align: left; padding: 9px 10px; border-radius: 10px; cursor: pointer; display: grid; grid-template-columns: 22px 1fr; gap: 2px 10px; align-items: center; opacity: .78; }
.nav button svg { width: 19px; height: 19px; grid-row: span 2; }
.nav button span { font-weight: 600; font-size: 14px; }
.nav button small { font-size: 11.5px; color: var(--side-muted); line-height: 1.3; }
.nav button:hover { background: var(--side-hover); opacity: 1; }
.nav button[aria-current="page"] { background: var(--side-hover); opacity: 1; box-shadow: inset 3px 0 0 var(--accent); }
.nav button[aria-current="page"] svg { color: var(--accent); }
.side-foot { margin-top: auto; display: grid; gap: 8px; font-size: 12px; color: var(--side-muted); padding: 0 6px; }
.side-foot .chip { border-color: var(--side-line); color: var(--side-ink); }
.side-foot a { color: var(--side-ink); }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 20px; padding: calc(14px + env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-right, 0px)) 14px 28px; }
.top h1 { font-size: 21px; font-weight: 700; }
.top .sub { color: var(--ink-2); font-size: 13.5px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 4px 0 10px; box-shadow: var(--shadow); }
.field label { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.field select { border: 0; background-color: var(--surface); color: var(--ink); color-scheme: inherit; padding: 7px 6px; font-size: 13.5px; font-weight: 600; cursor: pointer; max-width: 220px; }
.field select:focus-visible { outline: none; }
select option, select optgroup { background-color: var(--surface); color: var(--ink); }
select option:checked { background-color: var(--accent-soft); color: var(--ink); }
.field:focus-within { border-color: var(--accent); }
.content { padding: 22px max(28px, env(safe-area-inset-right, 0px)) 40px 28px; display: flex; flex-direction: column; gap: 18px; max-width: 1360px; width: 100%; }
.view[hidden] { display: none !important; }
.view { display: flex; flex-direction: column; gap: 18px; }

/* ---------- Manchete ---------- */
.headline { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: start; box-shadow: var(--shadow); }
.headline .hi { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; }
.headline .hi svg { width: 22px; height: 22px; }
.headline.ok .hi { background: var(--ok-bg); color: var(--ok); }
.headline.warn .hi { background: var(--warn-bg); color: var(--warn); }
.headline.bad .hi { background: var(--bad-bg); color: var(--bad); }
.headline h2 { font-size: 18.5px; font-weight: 650; line-height: 1.35; }
.headline p { color: var(--ink-2); margin-top: 5px; max-width: 95ch; }

/* ---------- Indicadores ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .kpis { grid-template-columns: minmax(0, 1fr); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; box-shadow: var(--shadow); }
.kpi .k-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.kpi .k-lab { font-size: 13px; font-weight: 600; color: var(--ink-2); display: flex; align-items: center; gap: 6px; min-width: 0; }
.kpi .k-val { font-size: 32px; font-weight: 750; line-height: 1.05; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi .k-val small { font-size: 16px; font-weight: 600; color: var(--ink-2); margin-left: 2px; letter-spacing: 0; }
.kpi .k-meta { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.kpi svg.spark { width: 100%; height: 34px; display: block; margin-top: 2px; }

.status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px 2px 7px; border-radius: 999px; white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.status.ok { background: var(--ok-bg); color: var(--ok); }
.status.warn { background: var(--warn-bg); color: var(--warn); }
.status.bad { background: var(--bad-bg); color: var(--bad); }
.status.neutral { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.delta { font-family: var(--mono); font-size: 11.5px; }
.delta.good { color: var(--ok); } .delta.badd { color: var(--bad); } .delta.flat { color: var(--muted); }

/* Explicação (i) */
.info { position: relative; display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; border: 1.4px solid var(--muted); color: var(--muted); font-size: 10.5px; font-weight: 700; font-family: var(--mono); cursor: help; background: none; padding: 0; flex-shrink: 0; }
.info .tip { position: absolute; right: -10px; top: calc(100% + 8px); width: min(250px, 80vw); display: none; background: var(--ink); color: var(--surface); font-family: var(--font); font-weight: 400; font-size: 12.5px; line-height: 1.45; text-align: left; padding: 9px 11px; border-radius: 9px; z-index: 30; opacity: 0; pointer-events: none; transition: opacity .12s; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.info:hover .tip, .info:focus .tip { opacity: 1; display: block; }

/* ---------- Cartões e grade ---------- */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.s12 { grid-column: span 12; } .s8 { grid-column: span 8; } .s7 { grid-column: span 7; } .s6 { grid-column: span 6; } .s5 { grid-column: span 5; } .s4 { grid-column: span 4; }
@media (max-width: 1100px) { .s8, .s7, .s6, .s5, .s4 { grid-column: span 12; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; box-shadow: var(--shadow); }
.card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.card h3 { font-size: 15.5px; font-weight: 650; }
.card .how { font-size: 12.5px; color: var(--muted); margin-top: 3px; max-width: 75ch; }
.chart { position: relative; height: 300px; width: 100%; }
.chart.sm { height: 240px; } .chart.lg { height: 340px; }
@media (max-width: 640px) { .chart, .chart.lg { height: 260px; } }
.chart-msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; padding: 20px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend i.line { height: 3px; border-radius: 2px; width: 16px; }
.legend i.dash { height: 0; width: 16px; border-top: 2px dashed var(--ink-2); border-radius: 0; }
.legend i.band { width: 16px; height: 10px; border-radius: 2px; }

/* Lista de achados */
.finds { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.finds li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; }
.finds .fi { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; }
.finds .fi svg { width: 16px; height: 16px; }
.finds .fi.ok { background: var(--ok-bg); color: var(--ok); }
.finds .fi.warn { background: var(--warn-bg); color: var(--warn); }
.finds .fi.bad { background: var(--bad-bg); color: var(--bad); }
.finds .fi.info { background: var(--accent-soft); color: var(--accent); }
.finds b { font-weight: 650; }
.finds p { color: var(--ink-2); font-size: 13.5px; }
.finds p:first-child { color: var(--ink); font-size: 14px; }

/* Tabelas */
.tscroll { overflow: auto; max-height: 460px; border: 1px solid var(--line); border-radius: 10px; }
.tscroll.free { max-height: none; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; z-index: 1; white-space: nowrap; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--surface-2); }
.sortable th { cursor: pointer; user-select: none; }
.sortable th[aria-sort="ascending"]::after { content: " ↑"; }
.sortable th[aria-sort="descending"]::after { content: " ↓"; }
.bar-in { display: inline-block; height: 7px; border-radius: 4px; background: var(--accent); vertical-align: middle; margin-right: 8px; opacity: .85; }
.meter { width: 84px; height: 7px; border-radius: 4px; background: var(--line-2); display: inline-block; vertical-align: middle; overflow: hidden; margin-right: 8px; }
.meter i { display: block; height: 100%; border-radius: 4px; }
.sub-txt { font-size: 12px; color: var(--muted); }

details.more { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
details.more > summary { cursor: pointer; list-style: none; padding: 14px 18px; font-weight: 650; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: "+"; font-family: var(--mono); font-size: 18px; color: var(--muted); }
details.more[open] > summary::after { content: "−"; }
details.more > summary small { font-weight: 400; color: var(--muted); font-size: 12.5px; }
details.more > .more-in { padding: 0 18px 18px; display: flex; flex-direction: column; gap: 12px; }

/* Controles */
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg button:hover:not([aria-pressed="true"]) { color: var(--ink); }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 13.5px; display: inline-flex; gap: 8px; align-items: center; box-shadow: var(--shadow); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; }
.search { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; width: min(300px, 100%); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.chip { font-family: var(--mono); font-size: 11.5px; border: 1px solid var(--line); padding: 4px 9px; border-radius: 999px; display: inline-flex; gap: 6px; align-items: center; width: fit-content; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn-mark); }
.chip.on .dot { background: var(--ok-mark); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 1px 9px; border-radius: 999px; white-space: nowrap; font-weight: 550; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.pill.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.pill.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.pill.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

/* Mapa de calor */
.heat { display: grid; gap: 4px; font-size: 11.5px; }
.heat .hl { color: var(--muted); display: flex; align-items: center; }
.heat .hh { color: var(--muted); text-align: center; font-family: var(--mono); font-size: 10.5px; }
.heat .hc { border-radius: 6px; min-height: 30px; display: grid; place-items: center; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 12px; }
.scale { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); }
.scale .ramp { display: flex; gap: 2px; } .scale .ramp i { width: 18px; height: 8px; border-radius: 2px; }

/* Sobre */
.prose { display: grid; gap: 10px; color: var(--ink-2); max-width: 78ch; }
.prose ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; }
.prose b { color: var(--ink); }
.formula { font-family: var(--mono); font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; white-space: pre; color: var(--ink); }

.foot { color: var(--muted); font-size: 12px; padding: 0 28px 28px; }

/* ---------- Celular ---------- */
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: relative; height: auto; padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); gap: 12px; overflow: visible; }
  .nav-label, .nav button small, .side-foot { display: none; }
  .nav { flex-direction: row; overflow-x: auto; scrollbar-width: none; gap: 4px; margin: 0 -4px; }
  .nav::-webkit-scrollbar { display: none; }
  .nav button { grid-template-columns: 18px auto; white-space: nowrap; padding: 8px 12px; }
  .nav button svg { width: 17px; height: 17px; grid-row: auto; }
  .nav button[aria-current="page"] { box-shadow: inset 0 -3px 0 var(--accent); }
  .top { position: relative; backdrop-filter: none; }
  .top-in { padding: 14px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)); }
  .content { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); }
  .foot { padding: 0 max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
  .headline { grid-template-columns: minmax(0, 1fr); }
  .headline .hi { display: none; }
  .field select { max-width: 160px; }
  .theme-seg button { padding: 5px 8px; font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1000px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .board { grid-template-columns: minmax(0, 1fr); } }

<template id="tpl-sobre">
  <div class="grid">
    <div class="card s6"><h3>A empresa e os dados</h3><div class="prose">
      <p>A <b>Rotalume Indústria</b> é fictícia. Ela fabrica eixos e conjuntos mecânicos em três linhas (L1 Usinagem CNC, L2 Montagem e L3 Pintura) e três turnos, de segunda a sexta.</p>
      <p>Os dados são gerados no navegador com semente fixa: <b id="ab-p">—</b> registros de produção, <b id="ab-s">—</b> amostras de medição e <b id="ab-n">—</b> não conformidades, de nov/2025 a out/2026.</p>
      <p>Eventos colocados de propósito para a análise encontrar:</p>
      <ul>
        <li><b>abr–mai/2026 · L1:</b> desgaste de ferramenta desloca o diâmetro do eixo para cima. Corrigido em junho.</li>
        <li><b>jan–jul/2026 · L2, turno C:</b> equipe nova sem padronização aumenta a variação do torque. Treinamento em julho.</li>
        <li><b>jan–mar/2026 · L3:</b> a umidade do verão aumenta bolhas e escorrimento na pintura.</li>
      </ul></div></div>
    <div class="card s6"><h3>Fórmulas</h3>
<div class="formula">Disponibilidade = tempo produzindo ÷ tempo planejado
Performance     = (peças × ciclo ideal) ÷ tempo produzindo
Qualidade (FPY) = peças boas de primeira ÷ peças produzidas
OEE             = Disponibilidade × Performance × Qualidade

Custo má qual.  = refugo × custo + retrabalho × 30% do custo

Carta X̄  : limites = média ± A2·R̄   (n = 5 → A2 = 0,577)
Carta R  : limite superior = D4·R̄   (D4 = 2,114)
Cpk = mín(LSE − média ; média − LIE) ÷ 3σ (σ dentro da amostra)
Ppk = mesmo cálculo com o desvio-padrão total</div></div>
    <div class="card s12"><h3>Glossário e referências</h3><div class="prose"><ul>
      <li><b>CEP</b> (Controle Estatístico de Processo): separa a variação normal das causas especiais. Os limites de controle vêm dos 25 primeiros dias medidos.</li>
      <li><b>Limites de especificação</b>: o que o cliente aceita. Aparecem só no histograma, porque comparam peças individuais e não médias.</li>
      <li><b>PDCA</b>: Planejar, Executar (Do), Verificar (Check) e Agir. Ciclo de melhoria usado nas ações corretivas (ISO 9001:2015, cláusula 10.2).</li>
      <li><b>6M</b>: Método, Máquina, Mão de obra, Material, Medição e Meio ambiente.</li>
      <li>Referências: Montgomery, <i>Introduction to Statistical Quality Control</i>; Western Electric, <i>Statistical Quality Control Handbook</i> (1956); Nakajima, <i>Introduction to TPM</i> (1988).</li>
    </ul></div></div>
  </div>
</template>

    plugins: { rangeShade: { disabled: true }, refLines: { lines: [{ value: 80, label: "80%" }] }, tooltip: { callbacks: { label: c => c.dataset.type === "line" ? ` Acumulado: ${K.nf(1).format(c.parsed.y)}%` : ` ${fN(p[c.dataIndex].n)} ocorrências (${K.nf(1).format(c.parsed.y)}%)` } } } });
  // mapa de calor (sempre todas as linhas e turnos)
  const base = prod.filter(r => K.inRange(r.m));
  const cells = [0, 1, 2].map(l => [0, 1, 2].map(s => agg(base.filter(r => r.line === l && r.shift === s)).rate));
  const fl = cells.flat(), mn = Math.min(...fl), mx = Math.max(...fl), ramp = K.seq();
  const heat = $("#d-heat"); heat.style.gridTemplateColumns = "110px repeat(3, minmax(0, 1fr))";
  heat.innerHTML = `<span></span>${SHIFTS.map(s => `<span class="hh">Turno ${s}</span>`).join("")}` + cells.map((row, l) => `<span class="hl">${LINES[l].curto}</span>${row.map((v, s) => { const k = mx === mn ? 0 : Math.round((v - mn) / (mx - mn) * 5); const on = (state.line === "all" || +state.line === l) && (state.shift === "all" || +state.shift === s); return `<span class="hc" style="background:${ramp[k]};color:${K.textOn(ramp[k])};${on ? "" : "opacity:.35"};min-height:54px" title="${LINES[l].curto}, turno ${SHIFTS[s]}">${K.nf(1).format(v * 100)}</span>`; }).join("")}`).join("");
  $("#d-scale").innerHTML = `<span>menos</span><span class="ramp">${ramp.map(c => `<i style="background:${c}"></i>`).join("")}</span><span>mais defeitos</span>`;
  $("#d-trend-t").textContent = `Evolução do defeito: ${defSel || "—"}`;
  const all = prod.filter(r => inL(r) && inS(r));
  const ser = MONTHS.map(mm => sum(all.filter(r => r.m === mm.i), r => { const k = LINES[r.line].defeitos.indexOf(defSel); return k >= 0 ? r.byType[k] : 0; }));
  K.chart("d-trend", "bar", { labels: K.monthLabels(), datasets: [{ label: defSel, data: ser, backgroundColor: K.dim(MONTHS, () => acc), borderRadius: 5, maxBarThickness: 40 }] },
    { plugins: { rangeShade: { disabled: true }, tooltip: { callbacks: { label: c => ` ${fN(c.parsed.y)} ocorrências` } } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } });
}

/* ============ ações (NC / PDCA) ============ */
const STAGES = [["Planejar", "P"], ["Executar", "D"], ["Verificar", "C"], ["Agir", "A"]];
let ncStatus = "all", ncQuery = "", ncSort = { k: "open", d: -1 };
function vAcoes() {
  const selN = ncs.filter(n => K.inRange(n.m) && inL(n)), open = ncs.filter(n => n.isOpen && inL(n)), late = open.filter(n => n.late), closed = selN.filter(n => !n.isOpen);
  const onTime = closed.length ? closed.filter(n => !n.closedLate).length / closed.length : NaN, eff = closed.length ? 1 - closed.filter(n => n.reinc).length / closed.length : NaN;
  K.headline($("#a-head"), { status: late.length ? "bad" : onTime < 0.9 ? "warn" : "ok",
    title: late.length ? `${late.length} ${late.length > 1 ? "ações corretivas estão vencidas" : "ação corretiva está vencida"} e ${K.pl(open.length - late.length, "segue", "seguem")} dentro do prazo.` : `Nenhuma ação corretiva vencida. ${open.length === 0 ? "Não há ações em aberto." : K.pl(open.length, "segue dentro do prazo.", "seguem dentro do prazo.")}`,
    text: `${K.periodLabel().charAt(0).toUpperCase() + K.periodLabel().slice(1)}, ${fP(onTime, 0)} das ações foram encerradas no prazo e ${fP(eff, 0)} resolveram o problema sem reincidência.` });
  K.kpis($("#a-kpis"), [
    { label: "Abertas agora", tip: "Não conformidades ainda em tratamento.", value: fN(open.length), target: `${fN(selN.length)} registradas no período` },
    { label: "Vencidas", tip: "Abertas há mais tempo que o prazo da gravidade: 15 dias (crítica), 30 (maior) ou 45 (menor).", value: fN(late.length), target: "Meta: nenhuma", status: late.length ? (late.length > 2 ? "bad" : "warn") : "ok" },
    { label: "Encerradas no prazo", tip: "Parte das não conformidades encerradas dentro do prazo, no período.", value: fN(onTime * 100, 0), unit: "%", target: "Meta ≥ 90%", status: statusOf(onTime, 0.9, true, 0.15) },
    { label: "Eficácia das ações", tip: "Encerradas que não voltaram a acontecer. É o Verificar do PDCA medido.", value: fN(eff * 100, 0), unit: "%", target: "Meta ≥ 90%", status: statusOf(eff, 0.9, true, 0.05) },
  ]);
  $("#a-count").textContent = `${open.length} abertas`;
  const gp = { "Menor": "", "Maior": "warn", "Crítica": "bad" };
  $("#a-board").innerHTML = STAGES.map(([st, l]) => { const items = open.filter(n => n.stage === st).sort((a, b) => a.prazo - b.prazo);
    return `<div class="col"><div class="col-h"><b><span class="lt">${l}</span>${st}</b><span>${items.length}</span></div>${items.map(n => `<div class="nc${n.late ? " late" : ""}"><div class="nc-top"><span class="mono">${n.code}</span><span class="pill ${gp[n.grav]}">${n.grav}</span></div><p>${esc(n.desc)}</p><div class="nc-meta"><span>${LINES[n.line].id} · ${esc(n.area)}</span><span>${n.late ? `<b style="color:var(--bad)">venceu em ${fDate(n.prazo)}</b>` : `prazo ${fDate(n.prazo)}`}</span></div></div>`).join("") || `<div class="empty">Nada nesta etapa.</div>`}</div>`; }).join("");
  const c6 = CAUSAS.map(cz => ({ cz, n: selN.filter(n => n.causa === cz).length })).sort((a, b) => b.n - a.n);
  K.chart("a-6m", "bar", { labels: c6.map(x => x.cz), datasets: [{ data: c6.map(x => x.n), backgroundColor: c6.map((_, i) => i === 0 ? css("--accent") : css("--seq-2")), borderRadius: 5, maxBarThickness: 22 }] },
    { indexAxis: "y", interaction: { mode: "nearest", axis: "y", intersect: false }, scales: { x: { beginAtZero: true, grid: { color: css("--line-2") }, ticks: { precision: 0 } }, y: { grid: { display: false }, border: { display: false }, ticks: { color: css("--ink-2") } } }, plugins: { rangeShade: { disabled: true }, tooltip: { callbacks: { label: c => ` ${c.parsed.x} não conformidades · área: ${AREA[c6[c.dataIndex].cz]}` } } } });
  const og = ORIGENS.map((o, i) => ({ o, i, n: selN.filter(n => n.origem === o).length })).sort((a, b) => b.n - a.n), cc = K.CC();
  K.chart("a-orig", "bar", { labels: og.map(x => x.o), datasets: [{ data: og.map(x => x.n), backgroundColor: og.map(x => x.o === "Reclamação de cliente" ? css("--bad-mark") : css("--seq-4")), borderRadius: 5, maxBarThickness: 22 }] },
    { indexAxis: "y", interaction: { mode: "nearest", axis: "y", intersect: false }, scales: { x: { beginAtZero: true, grid: { color: css("--line-2") }, ticks: { precision: 0 } }, y: { grid: { display: false }, border: { display: false }, ticks: { color: css("--ink-2") } } }, plugins: { rangeShade: { disabled: true }, tooltip: { callbacks: { label: c => ` ${c.parsed.x} não conformidades` } } } });
  ncTable();
}
function ncTable() {
  let rows = ncs.filter(n => K.inRange(n.m) && inL(n));
  if (ncStatus === "open") rows = rows.filter(n => n.isOpen); else if (ncStatus === "late") rows = rows.filter(n => n.late); else if (ncStatus === "closed") rows = rows.filter(n => !n.isOpen);
  const q = ncQuery.trim().toLowerCase(); if (q) rows = rows.filter(n => [n.code, n.desc, n.area, n.origem, n.causa, n.stage].join(" ").toLowerCase().includes(q));
  $("#a-all-n").textContent = `${rows.length} registros`;
  document.querySelectorAll("#a-status button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === ncStatus)));
  const gp = { "Menor": "", "Maior": "warn", "Crítica": "bad" }, go = { "Menor": 0, "Maior": 1, "Crítica": 2 };
  rows = rows.map(n => ({ ...n, gO: go[n.grav], lineN: LINES[n.line].id }));
  K.sortableTable($("#a-table"), [["code", "Código"], ["open", "Abertura"], ["lineN", "Linha"], ["gO", "Gravidade"], ["desc", "Descrição"], ["area", "Área"], ["stage", "Situação"], ["age", "Dias", 1]], rows, ncSort,
    n => `<tr><td class="mono">${n.code}</td><td class="num">${fDate(n.open)}</td><td>${n.lineN}</td><td><span class="pill ${gp[n.grav]}">${n.grav}</span></td><td>${esc(n.desc)}<br><span class="sub-txt">Causa: ${n.causa} · ${n.origem}${n.reinc ? " · reincidente" : ""}</span></td><td>${esc(n.area)}</td><td>${n.isOpen ? (n.late ? `<span class="pill bad">Vencida · ${n.stage}</span>` : `<span class="pill acc">${n.stage}</span>`) : `<span class="pill ok">Encerrada${n.closedLate ? " com atraso" : ""}</span>`}</td><td class="r">${n.age}</td></tr>`);
}
document.addEventListener("click", e => { const b = e.target.closest("#a-status button"); if (b) { ncStatus = b.dataset.v; ncTable(); } });
document.addEventListener("input", e => { if (e.target.id === "a-search") { ncQuery = e.target.value; ncTable(); } });
document.addEventListener("resort", e => { if (e.target.id === "a-table") ncTable(); }, true);

const tp = $("#tpl-sobre").content; tp.querySelector("#ab-p").textContent = fN(prod.length); tp.querySelector("#ab-s").textContent = fN(spc.length); tp.querySelector("#ab-n").textContent = fN(ncs.length);
K.shell({
  key: "rotalume-qual", title: "Qualidade", company: "Grupo Rotalume · empresa fictícia", asOf: "31/10/2026",
  accent: ["#3a56d4", "#8ea2ff", "#e6eafc", "#1e2650"],
  logo: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"/><path d="M8.5 12l2.5 2.5L16 9.5"/></svg>`,
  footer: "Projeto de portfólio de Breno Silva · Rotalume é uma empresa fictícia e todos os dados são simulados.",
  filters: [
    { id: "line", label: "Linha", options: [["all", "Todas"], ...LINES.map((l, i) => [String(i), l.curto])] },
    { id: "shift", label: "Turno", options: [["all", "Todos"], ...SHIFTS.map((s, i) => [String(i), "Turno " + s])] },
  ],
  views: [
    { id: "resumo", label: "Visão geral", icon: "home", desc: "Eficiência, qualidade e custo", heading: "Visão geral da qualidade", sub: "Eficiência das linhas, peças boas e custo da má qualidade", render: vResumo },
    { id: "cep", label: "Estabilidade", icon: "pulse", desc: "Controle estatístico (CEP)", heading: "Estabilidade do processo", sub: "O processo está sob controle e atende ao cliente?", hideFilters: ["line"], render: vCEP },
    { id: "defeitos", label: "Defeitos", icon: "bars", desc: "Pareto, linhas e turnos", heading: "Defeitos", sub: "Quais defeitos atacar primeiro e onde eles acontecem", render: vDefeitos },
    { id: "acoes", label: "Ações corretivas", icon: "cycle", desc: "Não conformidades no PDCA", heading: "Ações corretivas", sub: "Não conformidades em tratamento, prazos e eficácia", hideFilters: ["shift"], render: vAcoes },
    { id: "sobre", label: "Sobre os dados", icon: "book", desc: "Fórmulas e premissas", heading: "Sobre os dados", sub: "Como o painel foi construído", noFilters: true },
  ],
});
window.__q = { prod, spc, ncs, agg, BASE };
})();
